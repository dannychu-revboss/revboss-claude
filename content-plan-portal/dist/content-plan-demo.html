<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Plan Demo · RevBoss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>:root {
  --navy: #071744;
  --navy-2: #0b2367;
  --blue: #1545cd;
  --blue-soft: #e9eef9;
  --orange: #ff920a;
  --orange-ink: #b36400;
  --orange-soft: #fff1de;
  --green: #1c7a3e;
  --green-soft: #e6f4ea;
  --red: #b03535;
  --red-soft: #fbeaea;
  --cream: #faf3e7;
  --paper: #ffffff;
  --line: #eae2d0;
  --line-2: #f2ecdd;
  --muted: #5b6478;
  --faint: #8b95b5;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(7, 23, 68, 0.06), 0 8px 24px rgba(7, 23, 68, 0.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14.5px/1.5 "Commissioner", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--cream);
  color: var(--navy);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 24px; background: rgba(250, 243, 231, 0.92);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.topbar img { height: 26px; }
.topbar .eyebrow { margin-left: auto; }
.eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy-2); }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #2fb36a; box-shadow: 0 0 0 3px rgba(47, 179, 106, 0.18); }
.live.off i { background: var(--faint); box-shadow: none; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; max-width: 1360px; margin: 0 auto; padding: 24px; }
.main { min-width: 0; }
.side { position: sticky; top: 70px; height: calc(100vh - 94px); }
@media (max-width: 1080px) {
  .shell { grid-template-columns: 1fr; padding: 16px; }
  .side { position: fixed; inset: auto 0 0 0; top: auto; height: min(78vh, 640px); z-index: 50; transform: translateY(105%); transition: transform 0.22s ease; padding: 0 8px 8px; }
  .side.open { transform: none; }
  .chat-fab { display: flex !important; }
}

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.section { margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--navy-2); }
.note { font-size: 12.5px; color: var(--muted); }

/* ---------- header ---------- */
.plan-head .meta { font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange-ink); }
.plan-head h1 { font-size: 32px; font-weight: 800; margin: 6px 0 8px; line-height: 1.15; }
.plan-head h1 span { font-weight: 400; }
.plan-head .intro { max-width: 760px; color: #2a3352; font-size: 15px; }
.badge-draft { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 20px; background: var(--orange-soft); color: var(--orange-ink); vertical-align: 6px; }

/* ---------- waiting on you ---------- */
.asks { background: var(--orange-soft); border: 1px solid #f6d8ae; border-radius: var(--radius); padding: 14px 18px; margin-top: 18px; }
.asks .section-title { color: var(--orange-ink); margin-bottom: 6px; }
.ask { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.ask input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--blue); flex-shrink: 0; }
.ask b { color: var(--navy); }
.ask.done span { color: var(--faint); text-decoration: line-through; }
.ask .when { font-weight: 700; color: var(--blue); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 18px; }
.kpi { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
.kpi .num { font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpi.accent .num { color: var(--blue); }
.kpi.warn .num { color: var(--orange-ink); }
.kpi .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }

/* ---------- angle budget ---------- */
.angles { display: grid; gap: 4px; }
.angle-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 84px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.angle-row:last-child { border-bottom: 0; }
.angle-name { font-weight: 800; }
.angle-why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.track { position: relative; height: 12px; border-radius: 6px; background: var(--line-2); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; background: #c9d3ee; border-radius: 6px; }
.track u { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 6px; }
.angle-count { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.angle-count b { font-size: 16px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
@media (max-width: 640px) { .angle-row { grid-template-columns: 1fr 70px; } .angle-row .track { grid-column: 1 / -1; grid-row: 2; } }

/* angle color chips */
.chip { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 9px; border-radius: 20px; white-space: nowrap; background: var(--blue-soft); color: var(--blue); }
.chip.a0 { background: #fff1de; color: #b36400; }
.chip.a1 { background: #e6f4ea; color: #1c7a3e; }
.chip.a2 { background: #e9eef9; color: #1545cd; }
.chip.a3 { background: #f3e8f7; color: #7a3c93; }
.chip.a4 { background: #e8f3f6; color: #22697b; }

/* ---------- status pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-posted { background: var(--green-soft); color: var(--green); }
.s-scheduled { background: var(--blue-soft); color: var(--blue); }
.s-approval_waiting { background: var(--orange-soft); color: var(--orange-ink); }
.s-approval_overdue { background: var(--red-soft); color: var(--red); }
.s-approval_not_sent { background: #f2ecdd; color: var(--muted); }
.s-todo { background: #f2ecdd; color: var(--muted); }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 30% { background: #fff6d6; } 100% { background: transparent; } }

/* ---------- plan views ---------- */
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--navy); color: #fff; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters select { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; color: var(--navy); }

table.posts { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.posts th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; background: var(--navy); padding: 9px 10px; font-weight: 800; }
table.posts th:first-child { border-top-left-radius: 8px; }
table.posts th:last-child { border-top-right-radius: 8px; }
table.posts td { padding: 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.posts tr.row { cursor: pointer; transition: background 0.12s; }
table.posts tr.row:hover { background: #fffaf2; }
table.posts tr.past td { color: var(--muted); }
table.posts .title { font-weight: 700; color: var(--blue); }
table.posts .tag { font-size: 12.5px; color: var(--muted); }
table.posts .metric { font-variant-numeric: tabular-nums; text-align: right; color: var(--navy); white-space: nowrap; }
table.posts .metric small { color: var(--faint); }
.table-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
@media (max-width: 760px) { table.posts .hide-sm { display: none; } }
@media (max-width: 560px) { table.posts .hide-xs { display: none; } table.posts td, table.posts th { padding: 9px 8px; } }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 4px; }
.cal .day { min-height: 104px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.cal .day.out { background: transparent; border-style: dashed; opacity: 0.55; }
.cal .day.today { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(255, 146, 10, 0.18); }
.cal .dnum { font-size: 12px; font-weight: 700; color: var(--muted); }
.cal .ev { border-radius: 6px; padding: 4px 6px; font-size: 11.5px; line-height: 1.3; cursor: pointer; border-left: 3px solid currentColor; background: #f7f3ea; color: var(--navy); }
.cal .ev:hover { filter: brightness(0.97); }
.cal .ev.s-posted { border-color: var(--green); }
.cal .ev.s-scheduled { border-color: var(--blue); }
.cal .ev.s-approval_waiting { border-color: var(--orange); }
.cal .ev.s-approval_overdue { border-color: var(--red); }
.cal .ev b { display: block; font-weight: 700; }
.cal .ev::before { display: none; }
@media (max-width: 760px) { .cal { grid-template-columns: 1fr; } .cal .dow, .cal .day.out, .cal .day.empty { display: none; } .cal .day { min-height: 0; } }

.status-key { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

/* ---------- sections + CTA ---------- */
.notes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.notes-grid pre { white-space: pre-wrap; font: inherit; font-size: 13.5px; margin: 8px 0 0; color: #2a3352; }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--navy); color: #fff; border-radius: var(--radius); padding: 18px 22px; flex-wrap: wrap; }
.cta p { margin: 0; max-width: 640px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--navy); padding: 8px 14px; border-radius: 9px; font-weight: 700; font-size: 13.5px; text-decoration: none !important; }
.btn:hover { border-color: #d8ccb2; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: var(--navy); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }

/* ---------- chat ---------- */
.chat { height: 100%; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.chat-head { padding: 14px 16px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; }
.chat-head .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--orange); display: grid; place-items: center; font-weight: 800; }
.chat-head h3 { font-size: 14.5px; }
.chat-head .note { font-size: 12px; }
.chat-head .close { margin-left: auto; border: 0; background: none; font-size: 20px; color: var(--muted); display: none; }
@media (max-width: 1080px) { .chat-head .close { display: block; } }
.msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 13.8px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #f7f3ea; border-bottom-left-radius: 4px; }
.msg.bot em { color: var(--muted); font-style: normal; font-size: 12px; }
.msg .tool { display: block; font-size: 11.5px; color: var(--faint); margin-bottom: 4px; }
.msg.err { background: var(--red-soft); color: var(--red); }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--orange); }
@keyframes blink { 50% { opacity: 0; } }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
.suggest button { border: 1px solid var(--line); background: #fffaf2; color: var(--navy-2); border-radius: 16px; padding: 5px 11px; font-size: 12.5px; }
.suggest button:hover { border-color: var(--orange); }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line-2); }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 14px; max-height: 120px; min-height: 40px; color: var(--navy); }
.composer textarea:focus, .drawer textarea:focus { outline: 2px solid rgba(21, 69, 205, 0.25); border-color: var(--blue); }
.composer button { border: 0; background: var(--blue); color: #fff; border-radius: 10px; padding: 0 14px; font-weight: 800; }
.chat-fab { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 40; align-items: center; gap: 8px; background: var(--navy); color: #fff; border: 0; border-radius: 28px; padding: 12px 18px; font-weight: 800; box-shadow: var(--shadow); }
.chat-fab i { color: var(--orange); font-style: normal; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(7, 23, 68, 0.32); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--paper); z-index: 61; transform: translateX(102%); transition: transform 0.22s ease; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(7, 23, 68, 0.15); }
.drawer.on { transform: none; }
.drawer .d-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line-2); }
.drawer .d-head .x { float: right; border: 0; background: none; font-size: 22px; color: var(--muted); line-height: 1; }
.drawer h2 { font-size: 21px; margin: 6px 0 8px; }
.drawer .d-body { padding: 16px 22px 24px; overflow-y: auto; flex: 1; }
.drawer .facts { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13.5px; }
.drawer .facts dt { color: var(--muted); }
.drawer .facts dd { margin: 0; }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.mgrid div { background: #f7f3ea; border-radius: 9px; padding: 10px; }
.mgrid b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
.mgrid span { font-size: 11.5px; color: var(--muted); }
.copy { white-space: pre-wrap; background: #fbf8f1; border: 1px solid var(--line-2); border-radius: 9px; padding: 12px; font-size: 13.5px; max-height: 240px; overflow: auto; }
.drawer textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font: inherit; font-size: 14px; color: var(--navy); resize: vertical; }
.fb { border-left: 3px solid var(--orange); background: #fffaf2; padding: 7px 10px; border-radius: 0 8px 8px 0; margin-top: 8px; font-size: 13px; }
.fb small { display: block; color: var(--muted); font-size: 11.5px; }

/* ---------- toast ---------- */
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow); animation: toast 0.25s ease; }
.toast b { color: var(--orange); }
@keyframes toast { from { transform: translateY(8px); opacity: 0; } }

/* ---------- team bar ---------- */
.teambar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--navy); color: #fff; padding: 9px 24px; font-size: 13px; }
.teambar b { color: var(--orange); letter-spacing: 0.08em; font-size: 11.5px; }
.teambar .btn { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: rgba(255, 255, 255, 0.2); }
.teambar .btn.primary { background: var(--orange); color: var(--navy); border-color: var(--orange); }
.teambar .spacer { flex: 1; }
.editable { outline: 1px dashed transparent; border-radius: 6px; }
.team .editable:hover { outline-color: #d8ccb2; }
.team .editable:focus { outline: 2px solid var(--blue); background: #fff; }

/* ---------- admin ---------- */
.admin { max-width: 1240px; margin: 0 auto; padding: 24px; }
.admin h1 { font-size: 26px; font-weight: 800; }
.client-group { margin-top: 22px; }
.client-group h2 { font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--navy-2); margin-bottom: 8px; }
.plan-rows { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
.plan-row { display: grid; grid-template-columns: minmax(170px, 1.3fr) minmax(220px, 2fr) 90px 110px minmax(240px, auto); gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-2); min-width: 900px; }
.plan-row:last-child { border-bottom: 0; }
.plan-row .who b { display: block; }
.plan-row .who span { font-size: 12px; color: var(--muted); }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); }
.stack i { display: block; height: 100%; }
.stack-lbl { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.plan-row .actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.dot-fb { display: inline-block; min-width: 20px; padding: 1px 7px; border-radius: 10px; background: var(--orange); color: var(--navy); font-size: 11.5px; font-weight: 800; text-align: center; }
.modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(7, 23, 68, 0.35); padding: 16px; }
.modal .card { width: min(460px, 100%); }
.modal label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; }
.modal input, .modal select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
@media (max-width: 560px) { .topbar .eyebrow { display: none; } .topbar { padding: 10px 16px; } }
.team .side { height: calc(100vh - 140px); }

/* ---------- board (kanban) ---------- */
.board-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.seg.sm button { padding: 3px 10px; font-size: 12.5px; }
.board { display: grid; grid-template-columns: repeat(var(--cols), minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.col { background: #f4eee2; border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 160px; transition: background 0.12s, border-color 0.12s; }
.col.drop { background: #fff6e6; border-color: var(--orange); border-style: dashed; }
.col-head { padding: 11px 12px 8px; border-bottom: 1px solid var(--line); }
.col-head > div:first-child { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col-head b { font-size: 13px; letter-spacing: 0.02em; }
.col-head .count { font-size: 12px; font-weight: 800; color: var(--muted); background: var(--paper); border-radius: 10px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.col-head .note { font-size: 11.5px; margin-top: 3px; }
.col-hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.col-waiting { border-top: 3px solid var(--orange); }
.col-scheduled { border-top: 3px solid var(--blue); }
.col-posted { border-top: 3px solid var(--green); }
.col-not_sent { border-top: 3px solid #c3c9d9; }
.col-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.col-empty { font-size: 12.5px; color: var(--faint); text-align: center; padding: 18px 0; }
.kcard { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; cursor: pointer; box-shadow: 0 1px 1px rgba(7, 23, 68, 0.04); transition: box-shadow 0.12s, transform 0.12s; }
.kcard:hover { box-shadow: var(--shadow); }
.kcard:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.kcard[draggable] { cursor: grab; }
.kcard.dragging { opacity: 0.45; transform: rotate(1deg); }

  <script>
(() => {
// Shared plan logic used by the API, the chat tools and the generator.

const STATUSES = {
  posted: { label: "Posted", rank: 0 },
  scheduled: { label: "Scheduled", rank: 1 },
  approval_waiting: { label: "Approval waiting", rank: 2 },
  approval_overdue: { label: "Approval overdue", rank: 3 },
  approval_not_sent: { label: "Approval not yet sent", rank: 4 },
  todo: { label: "To write", rank: 5 },
};

const STATUS_HELP =
  "Posted is live. Scheduled is approved and queued. Approval waiting is with you in Ordinal and needs your OK before its date. " +
  "Approval overdue has passed its date without an OK. Approval not yet sent is written and on the calendar; the request goes out ahead of its date.";

const FRAMEWORKS = {
  "The Four Angles": ["Playbook", "Proof", "Stance", "Human"],
  "The Five Pillars": ["Thought Leadership", "Playbook", "Influencers", "FOMO", "Product Marketing"],
};

function statusLabel(s) {
  return STATUSES[s]?.label || s;
}

// An approval that is still pending on or after its publish date is overdue.
function effectiveStatus(post, today = todayISO()) {
  if (post.status === "approval_waiting" && post.date && post.date < today) {
    return "approval_overdue";
  }
  return post.status;
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function summarize(plan, today = todayISO()) {
  const counts = Object.fromEntries(Object.keys(STATUSES).map((k) => [k, 0]));
  let impressions = 0;
  let engagements = 0;
  let measured = 0;
  for (const p of plan.posts) {
    counts[effectiveStatus(p, today)] = (counts[effectiveStatus(p, today)] || 0) + 1;
    if (p.metrics) {
      measured++;
      impressions += p.metrics.impressions || 0;
      engagements += (p.metrics.reactions || 0) + (p.metrics.comments || 0) + (p.metrics.reposts || 0);
    }
  }
  const angles = plan.angles.map((a) => {
    const posts = plan.posts.filter((p) => p.angle === a.name);
    return {
      ...a,
      planned: posts.length,
      published: posts.filter((p) => p.status === "posted").length,
    };
  });
  const next = plan.posts
    .filter((p) => p.date >= today && p.status !== "posted")
    .sort((a, b) => a.date.localeCompare(b.date))[0];
  return {
    total: plan.posts.length,
    counts,
    needsClient: counts.approval_waiting + counts.approval_overdue,
    openAsks: plan.waitingOn.filter((w) => !w.done).length,
    impressions,
    engagements,
    engagementRate: impressions ? engagements / impressions : null,
    measuredPosts: measured,
    angles,
    nextPost: next ? { id: next.id, date: next.date, title: next.title } : null,
  };
}

// The client-safe view of a plan: everything except internal fields.
function publicPlan(plan) {
  const { shareToken, ...rest } = plan;
  return {
    ...rest,
    posts: plan.posts.map((p) => ({ ...p, effectiveStatus: effectiveStatus(p) })),
    summary: summarize(plan),
    statusHelp: STATUS_HELP,
  };
}

function findPost(plan, ref) {
  if (!ref) return null;
  const r = String(ref).toLowerCase();
  return (
    plan.posts.find((p) => p.id === ref || p.ordinalPostId === ref) ||
    plan.posts.find((p) => p.title.toLowerCase() === r) ||
    plan.posts.find((p) => p.title.toLowerCase().includes(r)) ||
    null
  );
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(`${iso}T12:00:00Z`);
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });

const routes = {

  "POST /asks/:i": (b, [i]) => { const a = plan().waitingOn[+i]; if (!a) return json({ error: "no ask" }, 400); a.done = b.done !== false; emit({ kind: "ask", text: (a.done ? "Done: " : "Reopened: ") + a.ask }); return json({ ok: true }); },
  "POST /feedback": (b) => json({ saved: true, item: addFeedback(findPost(plan(), b.postId), String(b.message || "").slice(0, 2000)) }),
  "POST /feedback/:f/resolve": (b, [f]) => { const x = plan().feedback.find((y) => y.id === f); if (x) x.resolved = true; emit(null); return json({ ok: true }); },
  "PATCH ": (b) => { for (const k of ["intro", "waitingOn", "angles", "sections", "cta", "bookingUrl", "draft"]) if (k in b) plan()[k] = b[k]; emit({ kind: "edit", text: b.draft === false ? "Plan published to client" : "Plan updated by RevBoss" }); return json({}); },
  "PATCH /posts/:p": (b, [pid]) => {

    t = (asks.length ? "Open asks:\n" + asks.map((a) => "- " + (a.when ? a.when + ": " : "") + a.ask).join("\n") + "\n\n" : "No open asks right now.\n\n") +

  } else if (/(angle|pillar).*(most|count)|most.*(angle|pillar)/.test(q)) {
    const a = [...s.angles].sort((x, y) => y.planned - x.planned)[0];
    t = a.name + " has the most posts: " + a.planned + " of " + s.total + ".";
  } else if (/(change|move|edit|swap)/.test(q)) {
    t = "Open the post and use “Send to RevBoss”, or drag it to another column on the Board view (grouped by " + p.angleWord.toLowerCase() + ") to ask for a different " + p.angleWord.toLowerCase() + ".";
  } else if (/(next|upcoming|first)/.test(q)) {

  } else {

}
const realFetch = window.fetch.bind(window);
window.fetch = async (url, opts = {}) => {
  const m = String(url).match(/\/api\/plans\/[^/?]+(\/[^?]*)?/);
  if (!m) return realFetch(url, opts);
  const sub = m[1] || "", method = (opts.method || "GET").toUpperCase();
  const body = opts.body ? JSON.parse(opts.body) : {};
  for (const [k, fn] of Object.entries(routes)) {
    const [km, kp] = k.split(" ");
    if (km !== method) continue;
    const re = new RegExp("^" + kp.replace(/:[a-z]+/g, "([^/]+)") + "$");
    const hit = sub.match(re);
    if (hit) return fn(body, hit.slice(1));
  }
  return json({ error: "not in demo" }, 404);
};

  const canDrag = byAngle; // team: moves the post; client: asks RevBoss to move it
  const pending = (p.angleRequests || []).filter((r) => r.status === "pending");
  let cols;
  if (byAngle) {
    const names = [...p.angles.map((a) => a.name), ...new Set(rows.map((x) => x.angle).filter((n) => !p.angles.some((a) => a.name === n)))];
    cols = names.map((name) => {
      const a = p.summary.angles.find((x) => x.name === name);
      return { key: name, title: name, items: rows.filter((x) => x.angle === name), meta: a ? `${a.planned} planned · budget ${a.target}` : "", hint: a?.why || "" };
    });
  } else {
    cols = STATUS_COLUMNS.map((c) => ({ ...c, items: rows.filter((x) => c.statuses.includes(x.effectiveStatus)), meta: "" }))
      // "Not sent yet" only matters when something is in it; the other three always show.
      .filter((c) => c.key !== "not_sent" || c.items.length);
  }
  const today = todayISO();
  return `
    <div class="board-bar">
      <span class="note">Group by</span>
      <div class="seg sm">${[["status", "Status"], ["angle", esc(p.angleWord)]].map(([v, l]) => `<button data-board="${v}" class="${state.board === v ? "on" : ""}">${l}</button>`).join("")}</div>
      ${canDrag ? `<span class="note">${state.viewer === "team"
        ? `Drag a card to move it to another ${esc(p.angleWord.toLowerCase())}.`
        : `Drag a card to ask us to move it to another ${esc(p.angleWord.toLowerCase())}. Nothing changes until RevBoss approves.`}</span>` : ""}
    </div>
    <div class="board" style="--cols:${cols.length}">
      ${cols.map((c) => `<div class="col ${byAngle ? "" : `col-${c.key}`}" data-col="${esc(c.key)}">
        <div class="col-head">
          <div>${byAngle ? chip(c.title) : `<b>${esc(c.title)}</b>`}<span class="count">${c.items.length}</span></div>
          ${c.meta ? `<div class="note">${esc(c.meta)}</div>` : ""}
          ${c.hint ? `<div class="col-hint">${esc(c.hint)}</div>` : ""}
        </div>
        <div class="col-body">
          ${c.items.map((x) => card(x, { byAngle, canDrag, today, p, request: pending.find((r) => r.postId === x.id) })).join("")}
          ${byAngle ? pending.filter((r) => r.toAngle === c.key).map((r) => `<div class="kghost" data-post="${r.postId}" title="Waiting on RevBoss">
            <b>${esc(r.postTitle)}</b><span>Requested from ${esc(r.fromAngle)} · waiting on RevBoss</span></div>`).join("") : ""}
          ${c.items.length || (byAngle && pending.some((r) => r.toAngle === c.key)) ? "" : '<div class="col-empty">Nothing here</div>'}
        </div>
      </div>`).join("")}
    </div>`;
}

function requestBlock(r) {
  if (!r) return "";
  if (state.viewer === "team") {
    return `<div class="kc-req team">${esc(r.author)} asked to move this to <b>${esc(r.toAngle)}</b>${r.note ? `: “${esc(r.note)}”` : ""}
      <div class="kc-req-actions"><button class="btn sm blue" data-decide="approve" data-rid="${r.id}" data-stop>Move it</button><button class="btn sm" data-decide="decline" data-rid="${r.id}" data-stop>Keep</button></div></div>`;
  }
  return `<div class="kc-req">Requested: move to <b>${esc(r.toAngle)}</b> · waiting on RevBoss</div>`;
}

function card(x, { byAngle, canDrag, today, p, request }) {
  const m = x.metrics;
  const waiting = x.effectiveStatus === "approval_waiting" || x.effectiveStatus === "approval_overdue";
  return `<article class="kcard ${x.effectiveStatus === "approval_overdue" ? "overdue" : ""}" data-post="${x.id}" ${canDrag ? 'draggable="true"' : ""} tabindex="0">
    <div class="kc-top"><span class="kc-date ${x.date === today ? "is-today" : ""}">${esc(fmtDay(x.date))}</span>${byAngle ? pill(x) : chip(x.angle)}</div>
    <div class="kc-title">${esc(x.title)}</div>
    <div class="kc-meta">${esc(x.type)}${x.topicTag ? ` · ${esc(x.topicTag)}` : ""}${x.account && x.account.toLowerCase() !== p.person.toLowerCase() ? ` · ${esc(x.account)}` : ""}</div>
    ${m ? `<div class="kc-metrics"><span><b>${fmtN(m.impressions)}</b> impr.</span><span><b>${fmtN((m.reactions || 0) + (m.comments || 0) + (m.reposts || 0))}</b> eng.</span><span><b>${fmtPct(m.engagementRate)}</b></span></div>` : ""}
    ${requestBlock(request)}
    ${waiting && x.ordinalUrl ? `<a class="kc-cta" href="${esc(x.ordinalUrl)}" target="_blank" rel="noopener" data-stop>${x.effectiveStatus === "approval_overdue" ? "Past its date · " : ""}Approve in Ordinal ↗</a>` : ""}
  </article>`;
}

function bindBoard() {
  document.querySelectorAll("[data-board]").forEach((b) => b.addEventListener("click", () => { state.board = b.dataset.board; setPref("board", state.board); render(); }));
  document.querySelectorAll(".kcard [data-stop]").forEach((a) => a.addEventListener("click", (e) => e.stopPropagation()));
  document.querySelectorAll(".kcard").forEach((c) => c.addEventListener("keydown", (e) => e.key === "Enter" && openPost(c.dataset.post)));
  document.querySelectorAll("[data-decide]").forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation();
    decideRequest(b.dataset.rid, b.dataset.decide);
  }));
  if (state.board !== "angle") return;
  let dragId = null;
  document.querySelectorAll(".kcard[draggable]").forEach((c) => {
    c.addEventListener("dragstart", (e) => { dragId = c.dataset.post; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); document.querySelectorAll(".col.drop").forEach((x) => x.classList.remove("drop")); });
  });
  document.querySelectorAll(".col").forEach((col) => {
    col.addEventListener("dragover", (e) => { if (dragId) { e.preventDefault(); col.classList.add("drop"); } });
    col.addEventListener("dragleave", () => col.classList.remove("drop"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("drop");
      const post = state.plan.posts.find((x) => x.id === dragId);
      const angle = col.dataset.col;
      dragId = null;
      if (!post || post.angle === angle) return;
      if (state.viewer !== "team") return askToMove(post, angle);
      moveAngle(post, angle);
    });
  });
}

// Team: re-file a post directly.
async function moveAngle(post, angle) {
  post.angle = angle; // optimistic; the server's change event re-renders with the saved plan
  render();
  const res = await api(`/posts/${post.id}`, { method: "PATCH", body: JSON.stringify({ angle }) });
  if (!res.ok) { toast("Couldn't move that post"); load(); }
}

async function decideRequest(rid, decision) {
  const res = await api(`/angle-requests/${rid}`, { method: "POST", body: JSON.stringify({ decision }) });
  if (!res.ok) { toast((await res.json().catch(() => ({}))).error || "Couldn't update that request"); load(); }
}

// Client: confirm, with an optional note, before the request goes to RevBoss.
function askToMove(post, angle) {
  const word = state.plan.angleWord.toLowerCase();
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `<form class="card" role="dialog" aria-label="Request a different ${esc(word)}">
    <div class="section-title">Request a different ${esc(word)}</div>
    <p style="margin:10px 0 0">Ask RevBoss to move <b>${esc(post.title)}</b> from ${chip(post.angle)} to ${chip(angle)}?</p>
    <p class="note" style="margin:6px 0 0">The post stays where it is until the team approves. You'll see it update here.</p>
    <label for="mvNote">Anything we should know? (optional)</label>
    <textarea id="mvNote" rows="3" placeholder="e.g. This reads more like a client story than an opinion."></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button type="button" class="btn" data-cancel>Cancel</button>
      <button type="submit" class="btn primary">Send request</button>
    </div></form>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.addEventListener("click", (e) => e.target === wrap && close());
  wrap.querySelector("[data-cancel]").onclick = close;
  wrap.querySelector("textarea").focus();
  wrap.querySelector("form").onsubmit = async (e) => {
    e.preventDefault();
    const note = wrap.querySelector("textarea").value.trim();
    close();
    const res = await api("/angle-requests", { method: "POST", body: JSON.stringify({ postId: post.id, toAngle: angle, note }) });
    if (!res.ok) toast((await res.json().catch(() => ({}))).error || "Couldn't send that request");
  };
}

function renderCalendar(p) {
  const rows = filtered(p);
  const [y, m] = p.month.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const start = new Date(first);
  start.setUTCDate(1 - ((first.getUTCDay() + 6) % 7)); // Monday-start weeks
  const today = todayISO();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setUTCDate(start.getUTCDate() + i);
    const iso = d.toISOString().slice(0, 10);
    if (i >= 35 && d.getUTCMonth() !== m - 1) break;
    const evs = rows.filter((x) => x.date === iso);
    const out = d.getUTCMonth() !== m - 1;
    cells.push(`<div class="day ${out ? "out" : ""} ${iso === today ? "today" : ""} ${evs.length ? "" : "empty"}">
      <div class="dnum">${d.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" })} ${d.getUTCDate()}</div>
      ${evs.map((x) => `<div class="ev s-${x.effectiveStatus}" data-post="${x.id}" title="${esc(statusText(x.effectiveStatus))}"><b>${esc(x.title)}</b>${esc(x.angle)} · ${esc(statusText(x.effectiveStatus))}${x.account ? ` · ${esc(x.account)}` : ""}</div>`).join("")}
    </div>`);
  }
  return `<div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="dow">${d}</div>`).join("")}${cells.join("")}</div>`;
}

function renderFeedback(p) {

    <div class="card">${items.map((f) => `<div class="fb">${esc(f.message)}<small>${esc(f.author)} · ${new Date(f.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}${f.postTitle ? ` · on "${esc(f.postTitle)}"` : " · on the plan"}${f.sentToOrdinal ? " · added to Ordinal" : ""}${f.resolved ? " · resolved" : ""}${state.viewer === "team" && !f.resolved ? ` · <a href="#" data-resolve="${f.id}">Mark resolved</a>` : ""}</small></div>`).join("")}</div></section>`;

function mdLite(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])_(.+?)_(?=[\s).,]|$)/g, "$1<em>$2</em>")
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function addMsg(role, text, cls = "") {
  const el = document.createElement("div");
  el.className = `msg ${role === "user" ? "user" : "bot"} ${cls}`;

const TOOL_TEXT = {
  get_plan_overview: "Reading your plan…",
  list_posts: "Looking through the posts…",
  get_post: "Checking that post in Ordinal…",
  get_performance: "Pulling LinkedIn numbers…",
  leave_feedback: "Passing that to the team…",
  complete_ask: "Updating your checklist…",
  request_angle_change: "Sending your request to the team…",
};

  } else {

let busy = false;
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  $("#send").disabled = true;
  $("#input").value = "";
  addMsg("user", text);
  const bubble = addMsg("assistant", "", "typing");
  let out = "";
  let toolNote = "";
  try {
    const res = await api("/chat", { method: "POST", body: JSON.stringify({ message: text, history }) });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, "");
        buf = buf.slice(i + 2);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") out += ev.text;
        if (ev.type === "tool") toolNote = TOOL_TEXT[ev.name] || "Working…";
        if (ev.type === "error") throw new Error(ev.message);
        bubble.innerHTML = (toolNote && !out ? `<span class="tool">${esc(toolNote)}</span>` : "") + mdLite(out);
        $("#msgs").scrollTop = $("#msgs").scrollHeight;
      }
    }
    bubble.classList.remove("typing");
    history.push({ role: "user", content: text }, { role: "assistant", content: out });
    saveHistory();
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.classList.add("err");
    bubble.textContent = err.message || "Something went wrong.";
  } finally {
    busy = false;
    $("#send").disabled = false;
  }
}

  $("#tbStatus").textContent = `${state.ordinal === "live" ? "Ordinal connected" : "Demo data"} · chat ${state.chat === "claude" ? "on" : "offline"}`;
  if (state.ordinal !== "live") $("#tbSimulate").classList.remove("hidden");
  $("#tbPublish").classList.toggle("hidden", !state.plan.draft);
  $("#tbSync").onclick = async () => {
    $("#tbSync").disabled = true;
    const r = await (await api("/sync", { method: "POST" })).json();
    $("#tbSync").disabled = false;
    toast(r.errors?.length ? `Sync finished with ${r.errors.length} error(s)` : `Synced ${r.checked} posts`);
  };
  $("#tbSimulate").onclick = () => api("/demo/approve-next", { method: "POST" });
  $("#tbCopy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(state.shareUrl);
      toast("Client link copied");
    } catch {
      prompt("Client link", state.shareUrl);
    }
  };
  $("#tbPublish").onclick = async () => {
    await api("", { method: "PATCH", body: JSON.stringify({ draft: false }) });
    state.plan.draft = false;
    $("#tbPublish").classList.add("hidden");
  };
}

function bindTeamEdits() {
  const intro = document.querySelector('[data-field="intro"]');
  intro?.addEventListener("blur", () => {
    if (intro.textContent.trim() !== state.plan.intro) patchPlan({ intro: intro.textContent.trim() });
  });
  document.querySelectorAll("[data-ask-text]").forEach((el) => {
    el.addEventListener("click", (e) => e.preventDefault());
    el.addEventListener("blur", () => {
      const i = Number(el.dataset.askText);
      const text = el.textContent.trim();
      const asks = state.plan.waitingOn.map((w) => ({ ...w }));
      if (!text) asks.splice(i, 1);
      else if (text !== asks[i].ask) asks[i].ask = text;
      else return;
      patchPlan({ waitingOn: asks });
    });
  });
  $("#addAsk")?.addEventListener("click", () => {
    const ask = prompt("What do you need from the client?");
    if (!ask) return;
    const when = prompt("When? (e.g. Tue Oct 13 — optional)") || "";
    patchPlan({ waitingOn: [...state.plan.waitingOn, { when, ask, done: false }] });
  });
}

async function patchPlan(body) {
  await api("", { method: "PATCH", body: JSON.stringify(body) });
}

load();
</script>
</body>
</html>
